<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="weather_sticks_together.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Узнать погоду на три дня вперед</h1>
        </header>
        
        <div id="current-location" class="current-location">
            <div class="location-info">
                <h2 id="current-location-name">Текущее местоположение</h2>
            </div>
            <div class="current-weather">
                <div class="temp-main" id="current-temp">--°C</div>
                <div class="weather-desc" id="current-desc">Загрузка...</div>
            </div>
        </div>
        
        <div id="loading" class="loading">
            <p>Определяем ваше местоположение...</p>
        </div>
        
        <div id="permission-denied" class="permission-denied" style="display: none;">
            <h3>Доступ к геолокации отклонен!</h3>
            <p>Пожалуйста, добавьте город вручную</p>
        </div>
        
        <div id="forecast-container" class="forecast-container" style="display: none;"></div>
        
        <div class="add-city-section">
            <h3>Добавить город</h3>
            <div class="city-form">
                <div class="autocomplete-wrapper">
                    <input type="text" 
                        id="city-input" 
                        placeholder="Введите название города..."
                        autocomplete="off"
                        class="city-input">
                    <div id="autocomplete-list" class="autocomplete-list"></div>
                </div>
                <button id="add-city-btn" class="add-btn">
                    Добавить
                </button>
            </div>
            <div id="cities-container" class="cities-grid"></div>
            <div id="cities-empty" class="empty-state" style="display: none;">
                <p>Вы еще не добавили ни одного города</p>
            </div>
            <div id="message-container"></div>
        </div>
        
        <div class="controls">
            <button id="update-btn" class="update-btn">Обновить все</button>
        </div>
        
        
    </div>
    
    <script src="weatherapp.js"></script>
</body>
</html>
